<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2e5a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Momo Maze</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="cv"></canvas>

<section id="title" class="screen show">
  <div class="logo"><span>Momo</span><b>Maze</b></div>
  <p class="tag">Bantu Momo cari jalan pulang 🐾</p>
  <button id="btnPlay" class="big">MAIN</button>
  <button id="btnContinue" class="mid">Sambung Level <span id="contLv">1</span></button>
  <div id="ver" class="ver"></div>
</section>

<section id="map" class="screen">
  <header class="bar"><button id="mapBack" class="ico">‹</button><h2 id="worldName">Taman Bunga</h2><div id="totStars" class="pill">⭐ 0</div></header>
  <p id="worldDesc" class="wdesc"></p>
  <div id="worldTabs" class="tabs"></div>
  <div id="grid" class="grid"></div>
</section>

<section id="hud" class="hud">
  <button id="btnPause" class="ico">II</button>
  <div class="pill" id="hLv">Lv 1</div>
  <div class="pill" id="hHearts"></div>
  <div class="pill" id="hStars">⭐ 0/3</div>
  <div class="pill" id="hKeys"></div>
  <div class="pill" id="hTime">0:00</div>
</section>
<div id="toast" class="toast"></div>
<div id="dpad" class="dpad">
  <button data-d="1" class="u">▲</button><button data-d="3" class="l">◀</button>
  <button data-d="2" class="r">▶</button><button data-d="0" class="d">▼</button>
</div>

<div id="modal" class="modal"><div class="card">
  <h2 id="mTitle"></h2>
  <div id="mStars" class="mstars"></div>
  <p id="mText"></p>
  <div id="mBtns" class="mbtns"></div>
</div></div>

<script src="levels.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
